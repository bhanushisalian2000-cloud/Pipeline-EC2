name: Create EC2 on AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  create-ec2:
    name: Create EC2 using Terraform
    runs-on: ubuntu-latest

    steps:

      # 1. Get the code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Connect GitHub Actions to AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::593737766945:role/Github-pipeline
          aws-region: ap-south-1

      # 3. Verify AWS connection
      - name: Verify AWS connection
        run: |
          aws sts get-caller-identity

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Initialize Terraform
      - name: Terraform Init
        run: |
          terraform init

      # 6. Check Terraform code
      - name: Terraform Validate
        run: |
          terraform validate

      # 7. Show what Terraform will create
      - name: Terraform Plan
        run: |
          terraform plan

      # 8. Create/update infrastructure
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve

      # 9. Display infrastructure information
      - name: Show Terraform Outputs
        run: |
          terraform output

