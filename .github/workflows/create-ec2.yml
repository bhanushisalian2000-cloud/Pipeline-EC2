name: EC2 Pipeline Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  create-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::593737766945:role/Github-pipeline
          aws-region: ap-south-1

      - name: Verify AWS
        run: |
          aws sts get-caller-identity

      - name: Create EC2 instance
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ami-06158a479c7fc4bd7 \
            --instance-type t2.micro \
            --key-name devops_exp_key \
            --tag-specifications \
              'ResourceType=instance,Tags=[{Key=Name,Value=github-ec2-demo},{Key=Project,Value=terraform-demo},{Key=Environment,Value=dev}]' \
            --query 'Instances[0].InstanceId' \
            --output text)

          echo "EC2 Instance created successfully!"
          echo "Instance ID: $INSTANCE_ID"

